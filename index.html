<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Al Jannah Perfumes</title>

<style>
body{
  margin:0;
  font-family: Arial;
  background:#f8f8f8;
}

/* HEADER */
.header{
  background:
    linear-gradient(135deg, rgba(0,0,0,0.85), rgba(30,30,30,0.85)),
    url('https://images.unsplash.com/photo-1594035910387-fea47794261f');
  background-size:cover;
  background-position:center;
  color:white;
  text-align:center;
  padding:60px 20px;
  border-bottom:2px solid gold;
}

/* LOGO */
.logo{
  width:120px;
  display:block;
  margin:auto;
  margin-bottom:10px;
  filter: brightness(0) invert(1);
}

h1{
  color:gold;
  margin:5px;
}

.tag{
  color:#ddd;
}

/* PRODUCTS */
.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
  padding:20px;
}

.product{
  background:white;
  padding:15px;
  border-radius:10px;
  text-align:center;
  box-shadow:0 2px 8px rgba(0,0,0,0.1);
  transition:0.3s;
}

.product:hover{
  transform:translateY(-5px);
}

.product img{
  width:100%;
  height:150px;
  object-fit:cover;
  border-radius:10px;
}

.btn{
  background:gold;
  border:none;
  padding:10px;
  width:100%;
  border-radius:5px;
  font-weight:bold;
}

/* CART */
.cart{
  background:white;
  margin:20px;
  padding:15px;
  border-radius:10px;
}

.order{
  background:green;
  color:white;
  padding:10px;
  width:100%;
  border:none;
}

.pay{
  background:#007bff;
  color:white;
  padding:10px;
  width:100%;
  border:none;
}

input{
  width:95%;
  padding:10px;
  margin:5px;
}
</style>
</head>

<body>

<!-- 🔥 EASY EDIT IMAGE NAMES -->
<script>
const img1 = "marj.jpg";
const img2 = "musk.jpg";
const img3 = "maryam.jpg";
</script>

<!-- HEADER -->
<div class="header">
  <img src="./logo.png" class="logo">
  <h1>Al Jannah Perfumes</h1>
  <p class="tag">Luxury Attar Collection ✨</p>
</div>

<!-- PRODUCTS -->
<div class="products">

<div class="product">
<img id="p1">
<h3>Marj Attar</h3>

<p style="text-decoration:line-through;color:red;">₹200</p>
<p style="color:green;font-weight:bold;">Offer ₹150</p>
<p style="color:orange;">Save ₹50</p>

<button class="btn" onclick="add('Marj Attar',150)">Add</button>
</div>

<div class="product">
<img id="p2">
<h3>Musk Rijali</h3>

<p style="text-decoration:line-through;color:red;">₹200</p>
<p style="color:green;font-weight:bold;">Offer ₹150</p>
<p style="color:orange;">Save ₹50</p>

<button class="btn" onclick="add('Musk Rijali',150)">Add</button>
</div>

<div class="product">
<img id="p3">
<h3>Maryam</h3>
<p>₹150</p>
<button class="btn" onclick="add('Maryam',150)">Add</button>
</div>

</div>

<!-- CART -->
<div class="cart">
<h3>🛒 Order Summary</h3>

<p id="items">No items</p>
<p>Total ₹<span id="total">0</span></p>

<input id="name" placeholder="Your Name">
<input id="address" placeholder="Address">

<button class="order" onclick="order()">WhatsApp Order</button>

<br><br>

<button class="pay" onclick="pay()">UPI Pay</button>

<div style="text-align:center;margin-top:10px;">
<p>Scan & Pay</p>
<img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=upi://pay?pa=919946800240@federal">
</div>
</div>

<script>
// 🔥 IMAGE LOAD
document.getElementById("p1").src = "./" + img1;
document.getElementById("p2").src = "./" + img2;
document.getElementById("p3").src = "./" + img3;

// CART
let total=0;
let list=[];

function add(n,p){
  total+=p;
  list.push(n);
  document.getElementById("total").innerText=total;
  document.getElementById("items").innerText=list.join(", ");
}

function order(){
let msg="🧾 Order: "+list.join(", ")+" | Total ₹"+total;
window.open("https://wa.me/919946800240?text="+encodeURIComponent(msg));
}

function pay(){
window.location.href="upi://pay?pa=919946800240@federal&am="+total;
}
</script>

</body>
</html>
