<!DOCTYPE html>
<html>
<head>

<title>Al Jannah Perfumes | Premium Attar Shop</title>

<meta name="description" content="Buy premium attar perfumes at best price. Order via WhatsApp.">

<meta name="google-site-verification" content="0hjziN4RgVmMMnO9IO4Kpgf-Sqru6mNv9PeYg4LcTvE" />

<style>
body { font-family: Arial; margin: 0; background: #f3f3f3; }

.main-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: linear-gradient(90deg, #131921, #232f3e);
  color: white;
  padding: 15px 20px;
}

.logo { font-size: 22px; font-weight: bold; }

#search {
  padding: 8px;
  width: 180px;
  border-radius: 5px;
  border: none;
}

.nav a {
  color: white;
  margin-left: 10px;
  text-decoration: none;
}

.nav a:hover { color: orange; }

.products {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px,1fr));
  gap: 20px;
  padding: 20px;
}

.product {
  background: white;
  padding: 15px;
  border-radius: 10px;
  text-align: center;
  box-shadow: 0 0 10px rgba(0,0,0,0.1);
  transition: 0.3s;
}

.product:hover { transform: scale(1.05); }

.product img {
  width: 100%;
  height: 150px;
  object-fit: cover;
}

.cart-btn {
  background: orange;
  border: none;
  padding: 10px;
  width: 100%;
  cursor: pointer;
}

.cart-btn:hover { background: darkorange; }

.order-btn {
  background: green;
  color: white;
  padding: 12px;
  width: 100%;
  border: none;
  margin-top: 10px;
}

.pay-btn {
  background: blue;
  color: white;
  padding: 12px;
  width: 100%;
  border: none;
  margin-top: 10px;
}

.cart-box {
  background: white;
  margin: 20px;
  padding: 15px;
  border-radius: 10px;
}

#cartPopup {
  display:none;
  position:fixed;
  top:25%;
  left:50%;
  transform:translateX(-50%);
  background:white;
  padding:20px;
  border-radius:10px;
  box-shadow:0 0 15px rgba(0,0,0,0.4);
}

input {
  width: 95%;
  padding: 10px;
  margin: 5px 0;
}
</style>

</head>

<body>

<header class="main-header">
  <div class="logo">🌿 Al Jannah Perfumes</div>

  <input type="text" id="search" placeholder="Search..." onkeyup="searchProduct()">

  <button onclick="openCart()">🛒 Cart</button>

  <div class="nav">
    <a href="#">Home</a>
    <a href="https://instagram.com/aljannahperfumes" target="_blank">Instagram</a>
  </div>
</header>

<h2 style="padding-left:20px;">Al Jannah Perfumes | Premium Attar Shop</h2>

<div class="products">

<div class="product">
<img src="https://images.unsplash.com/photo-1594035910387-fea47794261f">
<h3>Marj Attar</h3>
<p>3ML - ₹200</p>
<button class="cart-btn" onclick="addToCart('Marj Attar',200)">Add to Cart</button>
</div>

<div class="product">
<img src="https://images.unsplash.com/photo-1615634260167-c8cdede054de">
<h3>Musk Rijali</h3>
<p>3ML - ₹200</p>
<button class="cart-btn" onclick="addToCart('Musk Rijali',200)">Add to Cart</button>
</div>

<div class="product">
<img src="https://images.unsplash.com/photo-1600185365483-26d7a4cc7519">
<h3>Maryam Attar</h3>
<p>3ML - ₹150</p>
<button class="cart-btn" onclick="addToCart('Maryam Attar',150)">Add to Cart</button>
</div>

</div>

<div class="cart-box">
<h2>🛒 Cart Summary</h2>
<p id="items">Items: 0</p>
<p id="total">Total: ₹0</p>

<input type="text" id="name" placeholder="Your Name">
<input type="text" id="address" placeholder="Your Address">

<button class="order-btn" onclick="orderNow()">Order via WhatsApp</button>
<button class="pay-btn" onclick="payNow()">Pay via UPI</button>
</div>

<div id="cartPopup">
<h3>Your Cart</h3>
<p id="cartDetails"></p>
<button onclick="closeCart()">Close</button>
<button onclick="clearCart()">Clear</button>
</div>

<script>
let count = 0;
let total = 0;
let cartItems = "";

function addToCart(name, price) {
  count++;
  total += price;
  cartItems += name + ", ";

  document.getElementById("items").innerText = "Items: " + count;
  document.getElementById("total").innerText = "Total: ₹" + total;
}

function openCart() {
  document.getElementById("cartPopup").style.display = "block";
  document.getElementById("cartDetails").innerText = cartItems + " | Total ₹" + total;
}

function closeCart() {
  document.getElementById("cartPopup").style.display = "none";
}

function clearCart() {
  count = 0;
  total = 0;
  cartItems = "";

  document.getElementById("items").innerText = "Items: 0";
  document.getElementById("total").innerText = "Total: ₹0";

  closeCart();
}

function searchProduct() {
  let input = document.getElementById("search").value.toLowerCase();
  let products = document.getElementsByClassName("product");

  for (let i = 0; i < products.length; i++) {
    let text = products[i].innerText.toLowerCase();
    products[i].style.display = text.includes(input) ? "block" : "none";
  }
}

function orderNow() {
  let name = document.getElementById("name").value;
  let address = document.getElementById("address").value;

  let msg = "Order:\n" + cartItems + "\nTotal: ₹" + total +
            "\nName: " + name + "\nAddress: " + address;

  window.open("https://wa.me/918089900240?text=" + encodeURIComponent(msg));
}

function payNow() {
  window.location.href = "upi://pay?pa=919946800240@federal&pn=Al%20Jannah%20Perfumes&cu=INR";
}
</script>

</body>
</html>
