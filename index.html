<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Al Jannah Perfumes</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f5f5f5;
}

/* HERO */

.hero{
    height:320px;
    background:
    linear-gradient(rgba(0,0,0,0.55),rgba(0,0,0,0.55)),
    url('https://images.unsplash.com/photo-1541643600914-78b084683601?q=80&w=1200&auto=format&fit=crop');
    background-size:cover;
    background-position:center;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:white;
    border-bottom:3px solid gold;
}

.hero-content img{
    width:95px;
    height:95px;
    object-fit:contain;
    margin-bottom:15px;
}

.hero h1{
    font-size:55px;
    color:gold;
    margin-bottom:10px;
}

.hero p{
    font-size:24px;
}

/* PRODUCTS */

.products{
    width:90%;
    margin:40px auto;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:30px;
}

.card{
    background:white;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 5px 15px rgba(0,0,0,0.15);
    text-align:center;
    padding-bottom:20px;
    transition:0.3s;
}

.card:hover{
    transform:translateY(-5px);
}

.card img{
    width:100%;
    height:320px;
    object-fit:cover;
    display:block;
}

.card h2{
    margin-top:20px;
    font-size:32px;
    color:#111;
}

.old{
    color:red;
    text-decoration:line-through;
    font-size:28px;
    margin-top:15px;
}

.offer{
    color:green;
    font-size:38px;
    font-weight:bold;
    margin-top:10px;
}

.save{
    color:#d18b00;
    font-size:28px;
    margin-top:10px;
}

button{
    margin-top:20px;
    width:85%;
    padding:16px;
    border:none;
    border-radius:10px;
    background:gold;
    color:black;
    font-size:24px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#f5c400;
}

/* MOBILE */

@media(max-width:768px){

.hero{
    height:280px;
    padding:20px;
}

.hero-content img{
    width:90px;
    height:90px;
}

.hero h1{
    font-size:32px;
}

.hero p{
    font-size:20px;
}

.card img{
    height:280px;
}

.card h2{
    font-size:22px;
}

.old{
    font-size:20px;
}

.offer{
    font-size:30px;
}

.save{
    font-size:22px;
}

button{
    font-size:20px;
}

}

</style>
</head>
<body>

<!-- HERO -->

<section class="hero">

<div class="hero-content">

<img src="logo.png" alt="Logo">

<h1>Al Jannah Perfumes</h1>

<p>Luxury Attar Collection ✨</p>

</div>

</section>

<!-- PRODUCTS -->

<section class="products">

<!-- MARJ -->

<div class="card">

<img src="marj.jpg" alt="Marj">

<h2>Marj Attar</h2>

<div class="old">₹200</div>

<div class="offer">Offer ₹150</div>

<div class="save">Save ₹50</div>

<button>Add</button>

</div>

<!-- MUSK -->

<div class="card">

<img src="musk.jpg" alt="Musk">

<h2>Musk Rijali</h2>

<div class="old">₹200</div>

<div class="offer">Offer ₹150</div>

<div class="save">Save ₹50</div>

<button>Add</button>

</div>

<!-- MARYAM -->

<div class="card">

<img src="maryam.jpg" alt="Maryam">

<h2>Maryam</h2>

<div class="old">₹200</div>

<div class="offer">Offer ₹150</div>

<div class="save">Save ₹50</div>

<button>Add</button>

</div>

</section>

</body>
</html>
