<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Al Jannah Perfumes</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#f5f5f5;
}

.header{
    background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)),
    url('https://images.unsplash.com/photo-1592945403244-b3fbafd7f539');
    background-size:cover;
    background-position:center;
    text-align:center;
    padding:60px 20px;
    color:white;
    border-bottom:4px solid gold;
}

.logo{
    width:90px;
}

.title{
    font-size:32px;
    color:gold;
    font-weight:bold;
}

.products{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    padding:20px;
}

.card{
    background:white;
    width:300px;
    margin:15px;
    padding:15px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
    text-align:center;
}

.card img{
    width:100%;
    height:220px;
    object-fit:cover;
    border-radius:10px;
}

.old{color:red;text-decoration:line-through;}
.offer{color:green;font-weight:bold;}
.save{color:orange;}

.btn{
    background:gold;
    border:none;
    padding:12px;
    width:100%;
    border-radius:8px;
    font-weight:bold;
    margin-top:10px;
}

@media(max-width:600px){
    .card{width:90%;}
}
</style>
</head>

<body>

<div class="header">
    <img src="logo.png" class="logo">
    <div class="title">Al Jannah Perfumes</div>
    <p>Luxury Attar Collection ✨</p>
</div>

<div class="products">

    <div class="card">
        <img src="https://drive.google.com/uc?export=view&id=1OfWJj2P73utEB0voCxwb87oIX6TbCN8i">
        <h2>Marj Attar</h2>
        <p class="old">₹200</p>
        <p class="offer">Offer ₹150</p>
        <p class="save">Save ₹50</p>
        <button class="btn">Add</button>
    </div>

</div>

</body>
</html>
