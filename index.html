<!DOCTYPE html>
<html>
<head>

<title>Al Jannah Perfumes | Premium Attar Shop</title>

<meta name="description" content="Premium attar perfumes. Order via WhatsApp or UPI.">

<meta name="google-site-verification" content="0hjziN4RgVmMMnO9IO4Kpgf-Sqru6mNv9PeYg4LcTvE" />

<style>
body { margin:0; font-family:Arial; background:#f5f5f5; }

.main-header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#111;
  color:white;
  padding:15px;
}

.logo { font-size:22px; font-weight:bold; color:gold; }

#search { padding:8px; border-radius:5px; border:none; }

.banner {
  background:url('https://images.unsplash.com/photo-1595425970377-c9703cf48b6d') center/cover;
  height:220px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-size:28px;
  font-weight:bold;
}

.products {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
  padding:20px;
}

.product {
  background:white;
  padding:15px;
  border-radius:12px;
  text-align:center;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.product img {
  width:100%;
  height:160px;
  object-fit:cover;
  border-radius:10px;
}

.cart-btn { background:orange; padding:10px; width:100%; border:none; }

.order-btn { background:green; color:white; padding:12px; width:100%; border:none; margin-top:10px; }

.pay-btn { background:#007bff; color:white; padding:12px; width:100%; border:none; margin-top:10px; }

.cart-box { background:white; margin:20px; padding:15px; border-radius:10px; }

#cartPopup, #successPopup {
  display:none;
  position:fixed;
  top:30%;
  left:50%;
  transform:translateX(-50%);
  background:white;
  padding:20px;
  border-radius:10px;
  box-shadow:0 0 20px rgba(0,0,0,0.4);
}

input { width:95%; padding:10px; margin:5px 0; }
</style>

</head>

<body>

<header class="main-header">
  <div class="logo">🌿 Al Jannah</div>
  <input type="text" id="search" placeholder="Search..." onkeyup="searchProduct()">
  <button onclick="openCart()">🛒</button>
</header>

<div class="banner">Luxury Attar Collection ✨</div>

<div class="products">

<div class="product">
<img src="https://images.unsplash.com/photo-1594035910387-fea47794261f">
<h3>Marj Attar</h3>
<p>₹200</p>
<button class="cart-btn" onclick="addToCart('Marj Attar',200)">Add to Cart</button>
</div>

<div class="product">
<img src="https://images.unsplash.com/photo-1615634260167-c8cdede054de">
<h3>Musk Rijali</h3>
<p>₹200</p>
<button class="cart-btn" onclick="addToCart('Musk Rijali',200)">Add to Cart</button>
</div>

<div class="product">
<img src="https://images.unsplash.com/photo-1600185365483-26d7a4cc7519">
<h3>Maryam Attar</h3>
<p>₹150</p>
<button class="cart-btn" onclick="addToCart('Maryam Attar',150)">Add to Cart</button>
</div>

</div>

<!-- CART -->
<div class="cart-box">
<h2>🛒 Cart</h2>
<p id="items">Items: 0</p>
<p id="total">Total: ₹0</p>

<p style="color:green;">✔️ Secure UPI Payment</p>

<input type="text" id="name" placeholder="Your Name">
<input type="text" id="address" placeholder="Your Address">

<button class="order-btn" onclick="orderNow()">Order via WhatsApp</button>
<button class="pay-btn" onclick="payNow()">💳 Pay via UPI (GPay / PhonePe)</button>
</div>

<!-- POPUPS -->
<div id="cartPopup">
<h3>Your Cart</h3>
<p id="cartDetails"></p>
<button onclick="closeCart()">Close</button>
<button onclick="clearCart()">Clear</button>
</div>

<div id="successPopup">
<h3>✅ Order Sent Successfully!</h3>
<button onclick="closeSuccess()">OK</button>
</div>

<script>
let count=0,total=0,cartItems="";

function addToCart(n,p){
count++; total+=p; cartItems+=n+", ";
document.getElementById("items").innerText="Items: "+count;
document.getElementById("total").innerText="Total: ₹"+total;
}

function openCart(){
document.getElementById("cartPopup").style.display="block";
document.getElementById("cartDetails").innerText=cartItems+" | ₹"+total;
}

function closeCart(){ document.getElementById("cartPopup").style.display="none"; }

function clearCart(){
count=0; total=0; cartItems="";
document.getElementById("items").innerText="Items: 0";
document.getElementById("total").innerText="Total: ₹0";
closeCart();
}

function searchProduct(){
let input=document.getElementById("search").value.toLowerCase();
let p=document.getElementsByClassName("product");
for(let i=0;i<p.length;i++){
let t=p[i].innerText.toLowerCase();
p[i].style.display=t.includes(input)?"block":"none";
}
}

function orderNow(){
let n=document.getElementById("name").value;
let a=document.getElementById("address").value;

if(n=="" || a==""){ alert("Enter details"); return; }

let msg="Order:\n"+cartItems+"\n₹"+total+"\n"+n+"\n"+a;

window.open("https://wa.me/918089900240?text="+encodeURIComponent(msg));

document.getElementById("successPopup").style.display="block";
}

function closeSuccess(){ document.getElementById("successPopup").style.display="none"; }

function payNow(){
let name=document.getElementById("name").value;

if(name==""){ alert("Enter your name"); return; }

let upi="upi://pay?pa=919946800240@federal"+
"&pn=Al%20Jannah%20Perfumes"+
"&am="+total+
"&cu=INR"+
"&tn="+encodeURIComponent("Order: "+cartItems);

window.location.href=upi;
}
</script>

</body>
</html>
