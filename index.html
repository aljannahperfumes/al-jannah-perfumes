<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Al Jannah Perfumes</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Segoe UI,sans-serif;
    background:#0f0f0f;
    color:white;
}

/* HEADER */

.header{
    position:relative;
    text-align:center;
    padding:140px 20px;
    background:url('banner.jpg') center/cover no-repeat;
}

.header::before{
    content:'';
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.65);
}

.header-content{
    position:relative;
    z-index:2;
}

.logo{
    width:170px;
    margin-bottom:15px;
}

h1{
    font-size:45px;
    color:gold;
    text-shadow:0 0 15px gold;
}

.tag{
    color:#ddd;
    font-size:18px;
    margin-top:10px;
}

/* PRODUCTS */

.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:25px;
    padding:30px;
}

.product{
    background:#1a1a1a;
    border-radius:18px;
    overflow:hidden;
    border:1px solid rgba(255,215,0,0.2);
    transition:0.4s;
    box-shadow:0 0 10px rgba(0,0,0,0.4);
}

.product:hover{
    transform:translateY(-8px);
    box-shadow:0 0 20px gold;
}

.product img{
    width:100%;
    height:260px;
    object-fit:cover;
    cursor:pointer;
}

.product-content{
    padding:18px;
    text-align:center;
}

.product h2{
    margin-bottom:10px;
    color:gold;
}

.old{
    color:red;
    text-decoration:line-through;
    margin-bottom:5px;
}

.offer{
    color:#00ffb3;
    font-size:22px;
    font-weight:bold;
}

.save{
    color:gold;
    margin-top:5px;
}

.btn{
    margin-top:15px;
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:linear-gradient(45deg,gold,#ffcc00);
    color:black;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

.btn:hover{
    box-shadow:0 0 15px gold;
}

/* CART */

.cart{
    margin:25px;
    padding:25px;
    border-radius:15px;
    background:#161616;
    border:1px solid rgba(255,215,0,0.2);
}

.cart h2{
    color:gold;
    margin-bottom:15px;
}

#items{
    margin-bottom:10px;
}

.total{
    font-size:22px;
    color:#00ffb3;
    margin-bottom:15px;
}

input{
    width:100%;
    padding:12px;
    margin-bottom:12px;
    border:none;
    border-radius:8px;
    background:#2a2a2a;
    color:white;
}

.order-btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:8px;
    background:green;
    color:white;
    font-size:18px;
    cursor:pointer;
    margin-bottom:10px;
}

.pay-btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:8px;
    background:#007bff;
    color:white;
    font-size:18px;
    cursor:pointer;
}

/* MODAL */

.modal{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.9);
    justify-content:center;
    align-items:center;
    z-index:100;
}

.modal img{
    width:90%;
    max-width:500px;
    border-radius:15px;
}

/* MOBILE */

@media(max-width:768px){

    h1{
        font-size:30px;
    }

    .logo{
        width:130px;
    }

    .product img{
        height:220px;
    }

    .header{
        padding:100px 15px;
    }

}

</style>
</head>

<body>

<!-- HEADER -->

<div class="header">

    <div class="header-content">

        <img src="logo.png" class="logo">

        <h1>Al Jannah Perfumes</h1>

        <p class="tag">
            Luxury Attar Collection ✨
        </p>

    </div>

</div>

<!-- PRODUCTS -->

<div class="products">

    <!-- PRODUCT 1 -->

    <div class="product">

        <img src="marj.jpg" onclick="zoom(this.src)">

        <div class="product-content">

            <h2>Marj Attar</h2>

            <div class="old">₹200</div>

            <div class="offer">Offer ₹150</div>

            <div class="save">Save ₹50</div>

            <button class="btn"
            onclick="add('Marj Attar',150)">
            Add to Cart
            </button>

        </div>

    </div>

    <!-- PRODUCT 2 -->

    <div class="product">

        <img src="musk.jpg" onclick="zoom(this.src)">

        <div class="product-content">

            <h2>Musk Rijali</h2>

            <div class="old">₹200</div>

            <div class="offer">Offer ₹150</div>

            <div class="save">Save ₹50</div>

            <button class="btn"
            onclick="add('Musk Rijali',150)">
            Add to Cart
            </button>

        </div>

    </div>

    <!-- PRODUCT 3 -->

    <div class="product">

        <img src="maryam.jpg" onclick="zoom(this.src)">

        <div class="product-content">

            <h2>Maryam</h2>

            <div class="old">₹200</div>

            <div class="offer">Offer ₹150</div>

            <div class="save">Save ₹50</div>

            <button class="btn"
            onclick="add('Maryam',150)">
            Add to Cart
            </button>

        </div>

    </div>

</div>

<!-- CART -->

<div class="cart">

    <h2>🛒 Your Order</h2>

    <p id="items">No items added</p>

    <div class="total">
        Total ₹<span id="total">0</span>
    </div>

    <input type="text"
    id="name"
    placeholder="Your Name">

    <input type="text"
    id="address"
    placeholder="Your Address">

    <button class="order-btn"
    onclick="orderNow()">
    WhatsApp Order
    </button>

    <button class="pay-btn"
    onclick="payNow()">
    UPI Pay
    </button>

</div>

<!-- IMAGE ZOOM -->

<div class="modal"
id="modal"
onclick="closeModal()">

    <img id="modalImg">

</div>

<script>

let total = 0;
let cart = [];

function add(name,price){

    cart.push(name);

    total += price;

    document.getElementById("items").innerText =
    cart.join(", ");

    document.getElementById("total").innerText =
    total;

}

function orderNow(){

    let name =
    document.getElementById("name").value;

    let address =
    document.getElementById("address").value;

    let msg =
    "AL JANNAH PERFUMES ORDER%0A%0A" +

    "Name: " + name + "%0A" +

    "Address: " + address + "%0A%0A" +

    "Items: " + cart.join(", ") + "%0A" +

    "Total: ₹" + total;

    window.open(
    "https://wa.me/919946800240?text=" + msg
    );

}

function payNow(){

    window.location.href =
    "upi://pay?pa=919946800240@federal&pn=ALJANNAHPERFUMES&am=" + total;

}

/* IMAGE ZOOM */

function zoom(src){

    document.getElementById("modal").style.display =
    "flex";

    document.getElementById("modalImg").src =
    src;

}

function closeModal(){

    document.getElementById("modal").style.display =
    "none";

}

</script>

</body>
</html>
