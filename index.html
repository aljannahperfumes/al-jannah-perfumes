<!DOCTYPE html>
<html>
<head>
  <title>Al Jannah Perfumes</title>
  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #f5f5f5;
    }
    h1 {
      color: green;
    }
    .product {
      background: white;
      padding: 15px;
      margin: 20px;
      border-radius: 10px;
    }
    button {
      padding: 10px;
      margin: 5px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .cart-btn { background: orange; }
    .order-btn { background: green; color: white; }
  </style>
</head>

<body>

<h1>Al Jannah Perfumes 🌿</h1>
<p>Best Attar Collection</p>

<div class="product">
  <h3>Oud Attar</h3>
  <p>₹500</p>
  <button class="cart-btn" onclick="addToCart('Oud Attar',500)">Add to Cart</button>
</div>

<div class="product">
  <h3>Rose Attar</h3>
  <p>₹300</p>
  <button class="cart-btn" onclick="addToCart('Rose Attar',300)">Add to Cart</button>
</div>

<h2>Cart</h2>
<p id="cartItems">Items: 0</p>
<p id="total">Total: ₹0</p>

<input type="text" id="name" placeholder="Your Name"><br><br>
<input type="text" id="address" placeholder="Your Address"><br><br>

<button class="order-btn" onclick="orderNow()">Order Now</button>

<script>
let count = 0;
let total = 0;
let items = "";

function addToCart(name, price) {
  count++;
  total += price;
  items += name + ", ";

  document.getElementById("cartItems").innerText = "Items: " + count;
  document.getElementById("total").innerText = "Total: ₹" + total;
}

function orderNow() {
  let customer = document.getElementById("name").value;
  let address = document.getElementById("address").value;

  if (customer == "" || address == "") {
    alert("Please enter name and address");
    return;
  }

  let message = "Order from Al Jannah Perfumes%0A"
    + "Name: " + customer + "%0A"
    + "Address: " + address + "%0A"
    + "Items: " + items + "%0A"
    + "Total: ₹" + total;

  window.open("https://wa.me/918089900240?text=" + message);
}
</script>

</body>
</html>
