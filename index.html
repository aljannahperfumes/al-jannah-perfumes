<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Al Jannah Perfumes</title>

<style>
body{
  margin:0;
  font-family: Arial;
  background:#f3f3f3;
}

/* HEADER */
.header{
  background:linear-gradient(135deg,#000,#1a1a1a);
  color:white;
  text-align:center;
  padding:50px 20px;
}

/* LOGO FIX */
.logo{
  width:140px;
  max-width:90%;
  height:auto;
  margin-bottom:10px;
  filter: drop-shadow(0 0 12px gold);
}

/* MOBILE FIX */
@media(max-width:600px){
  .logo{
    width:110px;
  }
}

h1{
  color:gold;
  margin:5px;
}

.tag{
  color:#ccc;
}

/* INSTAGRAM */
.insta{
  display:inline-block;
  margin-top:10px;
  padding:8px 15px;
  background:#E1306C;
  color:white;
  border-radius:20px;
  text-decoration:none;
}

/* PRODUCTS */
.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
  padding:20px;
}

.product{
  background:white;
  padding:15px;
  border-radius:12px;
  text-align:center;
  box-shadow:0 0 12px rgba(0,0,0,0.1);
  transition:0.3s;
}

.product:hover{
  transform:translateY(-5px);
}

.product img{
  width:100%;
  height:150px;
  object-fit:cover;
  border-radius:8px;
}

.btn{
  background:orange;
  border:none;
  padding:10px;
  width:100%;
  border-radius:5px;
}

/* CART */
.cart{
  background:white;
  margin:20px;
  padding:15px;
  border-radius:12px;
}

.pay{
  background:#007bff;
  color:white;
  padding:12px;
  width:100%;
  border:none;
  border-radius:5px;
}

.order{
  background:green;
  color:white;
  padding:12px;
  width:100%;
  border:none;
  border-radius:5px;
}

input{
  width:95%;
  padding:10px;
  margin:5px;
  border-radius:5px;
  border:1px solid #ccc;
}

.qr{
  text-align:center;
  margin-top:10px;
}
.qr img{
  width:150px;
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <!-- LOGO FIXED -->
  <img src="logo.png" class="logo"
  onerror="this.src='https://via.placeholder.com/150'">

  <h1>Al Jannah Perfumes</h1>
  <p class="tag">Premium Attar Collection ✨</p>

  <a href="https://instagram.com/aljannahperfumes" target="_blank" class="insta">
    📲 Follow Instagram
  </a>
</div>

<!-- PRODUCTS -->
<div class="products">

<div class="product">
<img src="https://images.unsplash.com/photo-1592945403244-b3fbafd7f539">
<h3>Marj Attar</h3>

<p style="text-decoration:line-through; color:red;">₹200</p>
<p style="color:green; font-weight:bold;">Offer Price ₹150</p>
<p style="color:orange;">🔥 Save ₹50</p>

<button class="btn" onclick="add('Marj Attar',150)">Add to Cart</button>
</div>

<div class="product">
<img src="https://images.unsplash.com/photo-1615634260167-c8cdede054de">
<h3>Musk Rijali</h3>

<p style="text-decoration:line-through; color:red;">₹200</p>
<p style="color:green; font-weight:bold;">Offer Price ₹150</p>
<p style="color:orange;">🔥 Save ₹50</p>

<button class="btn" onclick="add('Musk Rijali',150)">Add to Cart</button>
</div>

<div class="product">
<img src="https://images.unsplash.com/photo-1585386959984-a4155224a1ad">
<h3>Maryam</h3>
<p>₹150</p>
<button class="btn" onclick="add('Maryam',150)">Add to Cart</button>
</div>

</div>

<!-- CART -->
<div class="cart">

<h3>🛒 Order Summary</h3>

<p id="items">No items</p>
<p>Total: ₹<span id="total">0</span></p>

<input id="name" placeholder="Your Name">
<input id="address" placeholder="Address">

<button class="order" onclick="whatsapp()">Order via WhatsApp</button>

<br><br>

<button class="pay" onclick="pay()">Pay via UPI</button>

<div class="qr">
<p>Scan & Pay</p>
<img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=upi://pay?pa=919946800240@federal">
</div>

</div>

<script>
let total=0;
let list=[];

function add(name,price){
  total+=price;
  list.push(name);
  document.getElementById("total").innerText=total;
  document.getElementById("items").innerText=list.join(", ");
}

function whatsapp(){
let n=document.getElementById("name").value;
let a=document.getElementById("address").value;

let msg="🧾 Al Jannah Perfumes Order\n\nItems: "+list.join(", ")+"\nTotal: ₹"+total+"\nName: "+n+"\nAddress: "+a;

window.open("https://wa.me/919946800240?text="+encodeURIComponent(msg));
}

function pay(){
if(total==0){
alert("Add items first");
return;
}

let upi="upi://pay?pa=919946800240@federal&pn=AlJannah&am="+total+"&cu=INR";

window.location.href=upi;
}
</script>

</body>
</html>
