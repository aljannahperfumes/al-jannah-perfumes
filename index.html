<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Al Jannah Perfumes</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f5f5;
}

/* HERO */

.hero{
    height:420px;
    background:
    linear-gradient(rgba(0,0,0,0.55),rgba(0,0,0,0.55)),
    url("https://images.unsplash.com/photo-1541643600914-78b084683601?q=80&w=1200&auto=format&fit=crop");
    background-size:cover;
    background-position:center;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:20px;
    border-bottom:4px solid gold;
}

.hero-content img{
    width:220px;
    max-width:90%;
    display:block;
    margin:auto;
    margin-bottom:20px;
    object-fit:contain;
}

.hero h1{
    color:gold;
    font-size:58px;
    margin-bottom:10px;
}

.hero p{
    color:white;
    font-size:28px;
}

/* PRODUCTS */

.products{
    width:90%;
    margin:50px auto;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:30px;
}

.card{
    background:white;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 5px 15px rgba(0,0,0,0.15);
    text-align:center;
    padding-bottom:20px;
    transition:0.3s;
}

.card:hover{
    transform:translateY(-5px);
}

.card img{
    width:100%;
    height:340px;
    object-fit:cover;
    display:block;
}

.card h2{
    margin-top:20px;
    font-size:32px;
}

.old{
    color:red;
    text-decoration:line-through;
    font-size:26px;
    margin-top:10px;
}

.offer{
    color:green;
    font-size:36px;
    font-weight:bold;
    margin-top:10px;
}

.save{
    color:#d28f00;
    font-size:24px;
    margin-top:10px;
}

button{
    width:85%;
    padding:15px;
    margin-top:20px;
    border:none;
    border-radius:10px;
    background:gold;
    font-size:22px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#f5c400;
}

/* MOBILE */

@media(max-width:768px){

.hero{
    height:330px;
}

.hero-content img{
    width:150px;
}

.hero h1{
    font-size:36px;
}

.hero p{
    font-size:20px;
}

.card img{
    height:270px;
}

.card h2{
    font-size:24px;
}

.old{
    font-size:20px;
}

.offer{
    font-size:28px;
}

.save{
    font-size:20px;
}

button{
    font-size:18px;
}

}

</style>
</head>

<body>

<!-- HERO -->

<section class="hero">

<div class="hero-content">

<img src="Logo.png" alt="Logo">

<h1>Al Jannah Perfumes</h1>

<p>Luxury Attar Collection ✨</p>

</div>

</section>

<!-- PRODUCTS -->

<section class="products">

<!-- PRODUCT 1 -->

<div class="card">

<img src="marj.jpg" alt="Marj">

<h2>Marj Attar</h2>

<div class="old">₹200</div>

<div class="offer">Offer ₹150</div>

<div class="save">Save ₹50</div>

<button>Add</button>

</div>

<!-- PRODUCT 2 -->

<div class="card">

<img src="musk.jpg" alt="Musk">

<h2>Musk Rijali</h2>

<div class="old">₹200</div>

<div class="offer">Offer ₹150</div>

<div class="save">Save ₹50</div>

<button>Add</button>

</div>

<!-- PRODUCT 3 -->

<div class="card">

<img src="maryam.jpg" alt="Maryam">

<h2>Maryam</h2>

<div class="old">₹200</div>

<div class="offer">Offer ₹150</div>

<div class="save">Save ₹50</div>

<button>Add</button>

</div>

</section>

</body>
</html>
