<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Al Jannah Perfumes</title>

<style>
body{
  margin:0;
  font-family: Arial;
  background:#f5f5f5;
}

/* HEADER */
.header{
  background:
  linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.8)),
  url('https://images.unsplash.com/photo-1594035910387-fea47794261f');
  background-size:cover;
  background-position:center;
  text-align:center;
  padding:60px 20px;
  color:white;
  border-bottom:2px solid gold;
}

.logo{
  width:130px;
  filter:brightness(0) invert(1);
}

h1{
  color:gold;
}

.tag{
  color:#ddd;
}

/* PRODUCTS */
.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
  padding:20px;
}

.product{
  background:white;
  padding:15px;
  border-radius:10px;
  text-align:center;
  box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

.product img{
  width:100%;
  height:160px;
  object-fit:cover;
  border-radius:10px;
}

.btn{
  background:gold;
  border:none;
  padding:10px;
  width:100%;
  border-radius:5px;
  font-weight:bold;
}

/* CART */
.cart{
  background:white;
  margin:20px;
  padding:15px;
  border-radius:10px;
}

.order{
  background:green;
  color:white;
  padding:10px;
  width:100%;
  border:none;
}

.pay{
  background:#007bff;
  color:white;
  padding:10px;
  width:100%;
  border:none;
}

input{
  width:95%;
  padding:10px;
  margin:5px;
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <img src="logo.png" class="logo">
  <h1>Al Jannah Perfumes</h1>
  <p class="tag">Luxury Attar Collection ✨</p>
</div>

<!-- PRODUCTS -->
<div class="products">

<div class="product">
<img src="marj.jpg">
<h3>Marj Attar</h3>

<p style="text-decoration:line-through;color:red;">₹200</p>
<p style="color:green;font-weight:bold;">Offer ₹150</p>
<p style="color:orange;">Save ₹50</p>

<button class="btn" onclick="add('Marj Attar',150)">Add</button>
</div>

<div class="product">
<img src="musk.jpg">
<h3>Musk Rijali</h3>

<p style="text-decoration:line-through;color:red;">₹200</p>
<p style="color:green;font-weight:bold;">Offer ₹150</p>
<p style="color:orange;">Save ₹50</p>

<button class="btn" onclick="add('Musk Rijali',150)">Add</button>
</div>

<div class="product">
<img src="maryam.jpg">
<h3>Maryam</h3>
<p>₹150</p>

<button class="btn" onclick="add('Maryam',150)">Add</button>
</div>

</div>

<!-- CART -->
<div class="cart">
<h3>🛒 Order Summary</h3>

<p id="items">No items</p>
<p>Total ₹<span id="total">0</span></p>

<input id="name" placeholder="Your Name">
<input id="address" placeholder="Address">

<button class="order" onclick="order()">Order via WhatsApp</button>

<br><br>

<button class="pay" onclick="pay()">Pay via UPI</button>

<div style="text-align:center;margin-top:10px;">
<p>Scan & Pay</p>
<img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=upi://pay?pa=919946800240@federal">
</div>
</div>

<script>
let total=0;
let list=[];

function add(name,price){
  total+=price;
  list.push(name);

  document.getElementById("total").innerText=total;
  document.getElementById("items").innerText=list.join(", ");
}

function order(){
let msg="Order: "+list.join(", ")+" | Total ₹"+total;
window.open("https://wa.me/919946800240?text="+encodeURIComponent(msg));
}

function pay(){
window.location.href="upi://pay?pa=919946800240@federal&am="+total;
}
</script>

</body>
</html>
