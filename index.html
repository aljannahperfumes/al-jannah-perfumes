<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Al Jannah Perfumes</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f3f3f3;
}

/* HERO */

.hero{
height:420px;
background:
linear-gradient(rgba(0,0,0,0.5),rgba(0,0,0,0.5)),
url("https://images.unsplash.com/photo-1541643600914-78b084683601?q=80&w=1200&auto=format&fit=crop");
background-size:cover;
background-position:center;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
border-bottom:3px solid gold;
}

.hero-content img{
width:220px;
max-width:90%;
display:block;
margin:auto;
margin-bottom:15px;
}

.hero h1{
font-size:60px;
color:gold;
margin-bottom:10px;
}

.hero p{
font-size:28px;
color:white;
}

/* PRODUCTS */

.products{
width:90%;
margin:40px auto;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:30px;
}

.card{
background:white;
border-radius:20px;
overflow:hidden;
box-shadow:0 5px 15px rgba(0,0,0,0.15);
padding-bottom:20px;
text-align:center;
}

.card img{
width:100%;
height:350px;
object-fit:cover;
display:block;
background:#eee;
}

.card h2{
font-size:32px;
margin-top:20px;
}

.old{
color:red;
text-decoration:line-through;
font-size:28px;
margin-top:10px;
}

.offer{
color:green;
font-size:38px;
font-weight:bold;
margin-top:10px;
}

.save{
color:#d89b00;
font-size:26px;
margin-top:10px;
}

button{
width:85%;
padding:15px;
border:none;
border-radius:10px;
background:gold;
font-size:24px;
font-weight:bold;
margin-top:20px;
cursor:pointer;
}

/* MOBILE */

@media(max-width:768px){

.hero{
height:320px;
}

.hero-content img{
width:150px;
}

.hero h1{
font-size:34px;
}

.hero p{
font-size:20px;
}

.card img{
height:280px;
}

.card h2{
font-size:24px;
}

.old{
font-size:22px;
}

.offer{
font-size:30px;
}

.save{
font-size:22px;
}

button{
font-size:20px;
}

}

</style>
</head>

<body>

<section class="hero">

<div class="hero-content">

<img src="./logo.png">

<h1>Al Jannah Perfumes</h1>

<p>Luxury Attar Collection ✨</p>

</div>

</section>

<section class="products">

<div class="card">

<img src="./marj.jpg">

<h2>Marj Attar</h2>

<div class="old">₹200</div>

<div class="offer">Offer ₹150</div>

<div class="save">Save ₹50</div>

<button>Add</button>

</div>

<div class="card">

<img src="./musk.jpg">

<h2>Musk Rijali</h2>

<div class="old">₹200</div>

<div class="offer">Offer ₹150</div>

<div class="save">Save ₹50</div>

<button>Add</button>

</div>

<div class="card">

<img src="./maryam.jpg">

<h2>Maryam</h2>

<div class="old">₹200</div>

<div class="offer">Offer ₹150</div>

<div class="save">Save ₹50</div>

<button>Add</button>

</div>

</section>

</body>
</html>
