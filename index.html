<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Al Jannah Perfumes</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#0f0f0f;
  color:white;
  font-family:Arial;
}

/* HEADER */

.header{
  text-align:center;
  padding:40px 20px;
  background:#111;
}

.logo{
  width:140px;
  margin-bottom:15px;
}

h1{
  color:gold;
  font-size:32px;
}

.tag{
  color:#ccc;
  margin-top:5px;
}

/* PRODUCTS */

.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
  padding:20px;
}

.product{
  background:#1b1b1b;
  border:1px solid #333;
  border-radius:15px;
  overflow:hidden;
  text-align:center;
  padding-bottom:15px;
}

.product img{
  width:100%;
  height:240px;
  object-fit:cover;
}

.product h3{
  margin-top:15px;
}

.old{
  color:red;
  text-decoration:line-through;
}

.offer{
  color:#00ffb3;
  font-size:22px;
  margin-top:5px;
}

.save{
  color:gold;
  margin-top:5px;
}

.btn{
  width:90%;
  padding:12px;
  border:none;
  background:gold;
  border-radius:8px;
  margin-top:15px;
  font-weight:bold;
  cursor:pointer;
}

/* CART */

.cart{
  padding:20px;
  background:#151515;
  margin:20px;
  border-radius:15px;
}

.cart h2{
  color:gold;
  margin-bottom:15px;
}

#items{
  margin-bottom:10px;
}

#total{
  color:#00ffb3;
}

input{
  width:100%;
  padding:14px;
  margin-top:10px;
  border:none;
  border-radius:8px;
  font-size:16px;
}

/* BUTTONS */

.order-btn{
  width:100%;
  padding:15px;
  margin-top:15px;
  border:none;
  background:green;
  color:white;
  font-size:18px;
  border-radius:8px;
  cursor:pointer;
}

.pay-btn{
  width:100%;
  padding:15px;
  margin-top:12px;
  border:none;
  background:#007bff;
  color:white;
  font-size:18px;
  border-radius:8px;
  cursor:pointer;
}

/* MOBILE */

@media(max-width:600px){

  h1{
    font-size:26px;
  }

  .logo{
    width:110px;
  }

  .product img{
    height:200px;
  }

}

</style>
</head>

<body>

<!-- HEADER -->

<div class="header">

<img src="logo.png" class="logo">

<h1>Al Jannah Perfumes</h1>

<p class="tag">
Luxury Attar Collection ✨
</p>

</div>

<!-- PRODUCTS -->

<div class="products">

<div class="product">

<img src="marj.jpg">

<h3>Marj Attar</h3>

<p class="old">₹200</p>

<p class="offer">Offer ₹150</p>

<p class="save">Save ₹50</p>

<button class="btn"
onclick="addItem('Marj Attar',150)">
Add to Cart
</button>

</div>

<div class="product">

<img src="musk.jpg">

<h3>Musk Rijali</h3>

<p class="old">₹200</p>

<p class="offer">Offer ₹150</p>

<p class="save">Save ₹50</p>

<button class="btn"
onclick="addItem('Musk Rijali',150)">
Add to Cart
</button>

</div>

<div class="product">

<img src="maryam.jpg">

<h3>Maryam</h3>

<p class="old">₹200</p>

<p class="offer">Offer ₹150</p>

<p class="save">Save ₹50</p>

<button class="btn"
onclick="addItem('Maryam',150)">
Add to Cart
</button>

</div>

</div>

<!-- CART -->

<div class="cart">

<h2>🛒 Order</h2>

<p id="items">No Items</p>

<h3>Total ₹<span id="total">0</span></h3>

<input type="text" id="name"
placeholder="Enter Name">

<input type="text" id="address"
placeholder="Enter Address">

<button class="order-btn"
onclick="sendWhatsApp()">

WhatsApp Order

</button>

<button class="pay-btn"
onclick="upiPay()">

UPI Pay

</button>

</div>

<script>

let cart = [];
let total = 0;

function addItem(name,price){

cart.push(name);

total += price;

document.getElementById("items").innerHTML =
cart.join(", ");

document.getElementById("total").innerHTML =
total;

}

function sendWhatsApp(){

let name =
document.getElementById("name").value;

let address =
document.getElementById("address").value;

let msg =
"AL JANNAH PERFUMES%0A%0A"+
"Items: "+cart.join(", ")+"%0A"+
"Total: ₹"+total+"%0A"+
"Name: "+name+"%0A"+
"Address: "+address;

window.open(
"https://wa.me/919946800240?text="+msg
);

}

function upiPay(){

window.location.href =
"upi://pay?pa=919946800240@federal&pn=ALJANNAH&am="+total;

}

</script>

</body>
</html>
