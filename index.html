<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Al Jannah Perfumes</title>

<style>
body{
  margin:0;
  font-family: Arial;
  background:#f3f3f3;
}

/* HEADER */
.header{
  background:linear-gradient(135deg,#000,#1a1a1a);
  color:white;
  text-align:center;
  padding:50px 20px;
}

/* LOGO TEXT BOX */
.logo-box{
  width:140px;
  height:140px;
  margin:auto;
  background:black;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 0 15px gold;
}

.logo-text{
  color:gold;
  font-weight:bold;
  text-align:center;
}

/* MOBILE */
@media(max-width:600px){
  .logo-box{
    width:110px;
    height:110px;
  }
}

h1{
  color:gold;
}

.tag{
  color:#ccc;
}

/* INSTAGRAM */
.insta{
  display:inline-block;
  margin-top:10px;
  padding:8px 15px;
  background:#E1306C;
  color:white;
  border-radius:20px;
  text-decoration:none;
}

/* PRODUCTS */
.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
  padding:20px;
}

.product{
  background:white;
  padding:15px;
  border-radius:12px;
  text-align:center;
}

.product img{
  width:100%;
  height:150px;
  object-fit:cover;
}

.btn{
  background:orange;
  border:none;
  padding:10px;
  width:100%;
}

/* CART */
.cart{
  background:white;
  margin:20px;
  padding:15px;
  border-radius:12px;
}

.pay{
  background:#007bff;
  color:white;
  padding:12px;
  width:100%;
  border:none;
}

.order{
  background:green;
  color:white;
  padding:12px;
  width:100%;
  border:none;
}

input{
  width:95%;
  padding:10px;
  margin:5px;
}

.qr{
  text-align:center;
}
.qr img{
  width:150px;
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">

<!-- 🔥 ALWAYS WORKING LOGO -->
<div class="logo-box">
  <div class="logo-text">
    AL JANNAH
  </div>
</div>

<h1>Al Jannah Perfumes</h1>
<p class="tag">Premium Attar Collection ✨</p>

<a href="https://instagram.com/aljannahperfumes" class="insta">
📲 Follow Instagram
</a>

</div>

<!-- PRODUCTS -->
<div class="products">

<div class="product">
<img src="https://images.unsplash.com/photo-1592945403244-b3fbafd7f539">
<h3>Marj Attar</h3>

<p style="text-decoration:line-through; color:red;">₹200</p>
<p style="color:green;">Offer ₹150</p>
<p style="color:orange;">Save ₹50</p>

<button class="btn" onclick="add('Marj',150)">Add</button>
</div>

<div class="product">
<img src="https://images.unsplash.com/photo-1615634260167-c8cdede054de">
<h3>Musk Rijali</h3>

<p style="text-decoration:line-through; color:red;">₹200</p>
<p style="color:green;">Offer ₹150</p>
<p style="color:orange;">Save ₹50</p>

<button class="btn" onclick="add('Musk',150)">Add</button>
</div>

<div class="product">
<img src="https://images.unsplash.com/photo-1585386959984-a4155224a1ad">
<h3>Maryam</h3>
<p>₹150</p>
<button class="btn" onclick="add('Maryam',150)">Add</button>
</div>

</div>

<!-- CART -->
<div class="cart">
<h3>🛒 Order</h3>

<p id="items">No items</p>
<p>Total ₹<span id="total">0</span></p>

<input id="name" placeholder="Name">
<input id="address" placeholder="Address">

<button class="order" onclick="order()">WhatsApp</button>

<br><br>

<button class="pay" onclick="pay()">UPI Pay</button>

<div class="qr">
<p>Scan</p>
<img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=upi://pay?pa=919946800240@federal">
</div>

</div>

<script>
let total=0;
let list=[];

function add(n,p){
total+=p;
list.push(n);
document.getElementById("total").innerText=total;
document.getElementById("items").innerText=list.join(",");
}

function order(){
let msg="Order: "+list.join(",")+" Total ₹"+total;
window.open("https://wa.me/919946800240?text="+msg);
}

function pay(){
window.location.href="upi://pay?pa=919946800240@federal&am="+total;
}
</script>

</body>
</html>
