<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Al Jannah Perfumes</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  background:#0f0f0f;
  color:white;
  font-family:Arial,sans-serif;
}

/* HEADER */

.header{
  position:relative;
  height:500px;

  background-image:
  linear-gradient(rgba(0,0,0,0.6),
  rgba(0,0,0,0.7)),
  url("perfume.jpg");

  background-size:cover;
  background-position:center;

  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
}

.header-content{
  z-index:2;
  padding:20px;
}

.logo{
  width:170px;
  margin-bottom:20px;

  filter:
  drop-shadow(0 0 10px gold)
  brightness(1.1);
}

.header h1{
  color:gold;
  font-size:55px;
  text-shadow:0 0 15px rgba(255,215,0,0.6);
}

.tag{
  margin-top:15px;
  color:#f5f5f5;
  font-size:20px;
}

.shop-btn{
  margin-top:25px;
  padding:14px 35px;
  border:none;
  border-radius:40px;

  background:linear-gradient(45deg,gold,#ffcc00);

  color:black;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;

  transition:0.3s;
}

.shop-btn:hover{
  transform:scale(1.07);
  box-shadow:0 0 20px gold;
}

/* PRODUCTS */

.products{
  padding:30px;
  display:grid;
  grid-template-columns:
  repeat(auto-fit,minmax(260px,1fr));

  gap:25px;
}

.product{
  background:#1a1a1a;
  border-radius:18px;
  overflow:hidden;
  text-align:center;

  border:1px solid rgba(255,215,0,0.2);

  transition:0.3s;
}

.product:hover{
  transform:translateY(-8px);
  box-shadow:0 0 20px rgba(255,215,0,0.3);
}

.product img{
  width:100%;
  height:280px;
  object-fit:cover;
}

.product h3{
  margin-top:18px;
  font-size:25px;
}

.old{
  color:red;
  text-decoration:line-through;
  margin-top:10px;
}

.offer{
  color:#00ffb3;
  font-size:24px;
  margin-top:6px;
}

.save{
  color:gold;
  margin-top:6px;
}

.btn{
  width:90%;
  padding:14px;
  border:none;
  border-radius:10px;

  background:gold;
  color:black;

  font-size:17px;
  font-weight:bold;

  cursor:pointer;

  margin:18px 0;
}

.btn:hover{
  box-shadow:0 0 15px gold;
}

/* CART */

.cart{
  background:#151515;
  margin:25px;
  padding:25px;
  border-radius:18px;

  border:1px solid rgba(255,215,0,0.2);
}

.cart h2{
  color:gold;
  margin-bottom:15px;
}

#items{
  margin-bottom:12px;
}

#total{
  color:#00ffb3;
}

input{
  width:100%;
  padding:15px;
  margin-top:12px;

  border:none;
  border-radius:10px;

  font-size:16px;
}

/* BUTTONS */

.order-btn{
  width:100%;
  padding:15px;

  margin-top:18px;

  border:none;
  border-radius:10px;

  background:green;
  color:white;

  font-size:18px;
  cursor:pointer;
}

.pay-btn{
  width:100%;
  padding:15px;

  margin-top:14px;

  border:none;
  border-radius:10px;

  background:#007bff;
  color:white;

  font-size:18px;
  cursor:pointer;
}

/* IMAGE ZOOM */

.modal{
  display:none;

  position:fixed;
  top:0;
  left:0;

  width:100%;
  height:100%;

  background:rgba(0,0,0,0.9);

  justify-content:center;
  align-items:center;

  z-index:999;
}

.modal img{
  width:85%;
  max-width:450px;
  border-radius:12px;
}

/* FOOTER */

.footer{
  text-align:center;
  padding:25px;
  color:#999;
}

/* MOBILE */

@media(max-width:768px){

.header{
  height:380px;
}

.logo{
  width:120px;
}

.header h1{
  font-size:34px;
}

.tag{
  font-size:15px;
}

.shop-btn{
  padding:12px 24px;
  font-size:15px;
}

.product img{
  height:220px;
}

}

</style>
</head>

<body>

<!-- HEADER -->

<div class="header">

<div class="header-content">

<img src="logo.png" class="logo">

<h1>Al Jannah Perfumes</h1>

<p class="tag">
Premium Luxury Attar Collection ✨
</p>

<a href="#products">
<button class="shop-btn">
Shop Now
</button>
</a>

</div>

</div>

<!-- PRODUCTS -->

<div class="products" id="products">

<!-- PRODUCT 1 -->

<div class="product">

<img src="marj.jpg"
onclick="zoom(this.src)">

<h3>Marj Attar</h3>

<p class="old">₹200</p>

<p class="offer">Offer ₹150</p>

<p class="save">Save ₹50</p>

<button class="btn"
onclick="addItem('Marj Attar',150)">
Add to Cart
</button>

</div>

<!-- PRODUCT 2 -->

<div class="product">

<img src="musk.jpg"
onclick="zoom(this.src)">

<h3>Musk Rijali</h3>

<p class="old">₹200</p>

<p class="offer">Offer ₹150</p>

<p class="save">Save ₹50</p>

<button class="btn"
onclick="addItem('Musk Rijali',150)">
Add to Cart
</button>

</div>

<!-- PRODUCT 3 -->

<div class="product">

<img src="maryam.jpg"
onclick="zoom(this.src)">

<h3>Maryam</h3>

<p class="old">₹200</p>

<p class="offer">Offer ₹150</p>

<p class="save">Save ₹50</p>

<button class="btn"
onclick="addItem('Maryam',150)">
Add to Cart
</button>

</div>

</div>

<!-- CART -->

<div class="cart">

<h2>🛒 Order</h2>

<p id="items">
No Items
</p>

<h3>
Total ₹<span id="total">0</span>
</h3>

<input type="text"
id="name"
placeholder="Enter Name">

<input type="text"
id="address"
placeholder="Enter Address">

<button class="order-btn"
onclick="sendWhatsApp()">

WhatsApp Order

</button>

<button class="pay-btn"
onclick="upiPay()">

UPI Pay

</button>

</div>

<!-- IMAGE MODAL -->

<div class="modal"
id="modal"
onclick="closeModal()">

<img id="modalImg">

</div>

<!-- FOOTER -->

<div class="footer">

© 2026 Al Jannah Perfumes

</div>

<script>

let cart = [];
let total = 0;

/* ADD TO CART */

function addItem(name,price){

cart.push(name);

total += price;

document.getElementById("items")
.innerHTML = cart.join(", ");

document.getElementById("total")
.innerHTML = total;

}

/* WHATSAPP */

function sendWhatsApp(){

let name =
document.getElementById("name").value;

let address =
document.getElementById("address").value;

let msg =
"AL JANNAH PERFUMES%0A%0A"+
"Items: "+cart.join(", ")+"%0A"+
"Total: ₹"+total+"%0A"+
"Name: "+name+"%0A"+
"Address: "+address;

window.open(
"https://wa.me/919946800240?text="+msg
);

}

/* UPI PAY */

function upiPay(){

window.location.href =
"upi://pay?pa=919946800240@federal&pn=ALJANNAH&am="+total;

}

/* IMAGE ZOOM */

function zoom(src){

document.getElementById("modal")
.style.display = "flex";

document.getElementById("modalImg")
.src = src;

}

function closeModal(){

document.getElementById("modal")
.style.display = "none";

}

</script>

</body>
</html>
