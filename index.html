<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="google-site-verification" content="0hjziN4RgVmMMnO9IO4Kpgf-Sqru6mNv9PeYg4LcTvE" />

<title>Al Jannah Perfumes</title>

<style>
body {
  font-family: Arial;
  margin: 0;
  background: #f3f3f3;
}

/* ===== LUXURY HEADER ===== */
.luxury-header {
  position: relative;
  height: 220px;
  background: url("https://images.unsplash.com/photo-1600180758890-6b94519a8ba6") center/cover no-repeat;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  color: white;
}

.overlay {
  position: absolute;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.6);
}

.header-content {
  position: relative;
  z-index: 2;
}

.logo {
  width: 70px;
  margin-bottom: 10px;
}

.header-content h1 {
  margin: 0;
  font-size: 28px;
  color: gold;
}

.header-content p {
  color: #ddd;
}

/* ===== PRODUCTS ===== */
.products {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px,1fr));
  gap: 20px;
  padding: 20px;
}

.product {
  background: white;
  padding: 15px;
  border-radius: 10px;
  text-align: center;
  box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

.product img {
  width: 100%;
  height: 150px;
  object-fit: cover;
  border-radius: 8px;
}

.product h3 {
  margin: 10px 0;
}

.product p {
  color: green;
  font-weight: bold;
}

.cart-btn {
  background: orange;
  border: none;
  padding: 10px;
  width: 100%;
  cursor: pointer;
}

/* ===== CART ===== */
.cart {
  background: white;
  margin: 20px;
  padding: 15px;
  border-radius: 10px;
}

.order-btn {
  background: green;
  color: white;
  padding: 12px;
  border: none;
  width: 100%;
}

.pay-btn {
  background: #007bff;
  color: white;
  padding: 12px;
  border: none;
  width: 100%;
}

/* ===== INPUT ===== */
input {
  width: 95%;
  padding: 10px;
  margin: 5px;
}
</style>
</head>

<body>

<!-- ===== HEADER ===== -->
<header class="luxury-header">
  <div class="overlay"></div>

  <div class="header-content">
    <img src="logo.png" class="logo">
    <h1>Al Jannah Perfumes</h1>
    <p>Premium Attar Collection ✨</p>
  </div>
</header>

<!-- ===== PRODUCTS ===== -->
<div class="products">

<div class="product">
  <img src="https://images.unsplash.com/photo-1592945403244-b3fbafd7f539">
  <h3>Marj Attar</h3>
  <p>3ML - ₹200</p>
  <button class="cart-btn" onclick="addToCart('Marj Attar',200)">Add to Cart</button>
</div>

<div class="product">
  <img src="https://images.unsplash.com/photo-1615634260167-c8cdede054de">
  <h3>Musk Rijali</h3>
  <p>3ML - ₹200</p>
  <button class="cart-btn" onclick="addToCart('Musk Rijali',200)">Add to Cart</button>
</div>

<div class="product">
  <img src="https://images.unsplash.com/photo-1585386959984-a4155224a1ad">
  <h3>Maryam Attar</h3>
  <p>3ML - ₹150</p>
  <button class="cart-btn" onclick="addToCart('Maryam Attar',150)">Add to Cart</button>
</div>

</div>

<!-- ===== CART ===== -->
<div class="cart">
  <h3>🛒 Cart</h3>
  <p>Items: <span id="count">0</span></p>
  <p>Total: ₹<span id="total">0</span></p>

  <input type="text" id="name" placeholder="Your Name">
  <input type="text" id="address" placeholder="Your Address">

  <button class="order-btn" onclick="orderNow()">Order via WhatsApp</button>

  <hr>

  <h3>💳 Payment Options</h3>

  <button class="pay-btn" onclick="payNow()">
    💳 Pay via UPI (GPay / PhonePe)
  </button>

  <p style="font-size:12px; color:gray; text-align:center;">
    ✔️ Safe & Secure Payment
  </p>

</div>

<!-- ===== SCRIPT ===== -->
<script>
let count = 0;
let total = 0;
let items = "";

function addToCart(name, price){
  count++;
  total += price;
  items += name + ", ";

  document.getElementById("count").innerText = count;
  document.getElementById("total").innerText = total;
}

function orderNow(){
  let name = document.getElementById("name").value;
  let address = document.getElementById("address").value;

  let msg = "Order:\nItems: " + items + "\nTotal: ₹" + total +
            "\nName: " + name + "\nAddress: " + address;

  window.open("https://wa.me/919946800240?text=" + encodeURIComponent(msg));
}

function payNow(){
  let name = document.getElementById("name").value;

  if(name==""){
    alert("Enter your name");
    return;
  }

  let upi = "upi://pay?pa=919946800240@federal" +
  "&pn=Al%20Jannah%20Perfumes" +
  "&am=" + total +
  "&cu=INR" +
  "&tn=" + encodeURIComponent("Order: " + items);

  window.location.href = upi;
}
</script>

</body>
</html>
