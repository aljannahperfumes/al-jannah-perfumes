<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Google verification -->
<meta name="google-site-verification" content="0hjziN4RgVmMMnO9IO4Kpgf-Sqru6mNv9PeYg4LcTvE" />

<title>Al Jannah Perfumes</title>

<style>
body {
  font-family: Arial;
  margin: 0;
  background: #f3f3f3;
}

/* HEADER */
header {
  background: linear-gradient(90deg,#0f2027,#203a43,#2c5364);
  padding: 15px;
  text-align: center;
  color: white;
}

.logo-box {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}

.logo-box img {
  width: 60px;
}

/* INSTAGRAM */
.insta {
  text-align: center;
  margin: 10px;
}

.insta a {
  color: #e1306c;
  text-decoration: none;
  font-weight: bold;
}

/* PRODUCTS */
.products {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px,1fr));
  gap: 20px;
  padding: 20px;
}

.product {
  background: white;
  padding: 15px;
  border-radius: 10px;
  text-align: center;
  box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

.product img {
  width: 100%;
  height: 150px;
  object-fit: cover;
  border-radius: 8px;
}

.product h3 {
  margin: 10px 0;
}

.product p {
  color: green;
  font-weight: bold;
}

.cart-btn {
  background: orange;
  border: none;
  padding: 10px;
  width: 100%;
  cursor: pointer;
}

/* CART */
.cart {
  background: white;
  margin: 20px;
  padding: 15px;
  border-radius: 10px;
}

/* FORM */
input {
  width: 95%;
  padding: 10px;
  margin: 5px;
}

.order-btn {
  background: green;
  color: white;
  padding: 12px;
  border: none;
  width: 100%;
}
</style>
</head>

<body>

<header>
  <div class="logo-box">
    <img src="logo.png">
    <h2>Al Jannah Perfumes</h2>
  </div>
</header>

<div class="insta">
  📸 <a href="https://instagram.com/aljannahperfumes" target="_blank">
  Follow on Instagram</a>
</div>

<div class="products">

<div class="product">
  <img src="https://images.unsplash.com/photo-1592945403244-b3fbafd7f539">
  <h3>Marj Attar</h3>
  <p>3ML - ₹200</p>
  <button class="cart-btn" onclick="addToCart('Marj Attar',200)">Add to Cart</button>
</div>

<div class="product">
  <img src="https://images.unsplash.com/photo-1615634260167-c8cdede054de">
  <h3>Musk Rijali</h3>
  <p>3ML - ₹200</p>
  <button class="cart-btn" onclick="addToCart('Musk Rijali',200)">Add to Cart</button>
</div>

<div class="product">
  <img src="https://images.unsplash.com/photo-1585386959984-a4155224a1ad">
  <h3>Maryam Attar</h3>
  <p>3ML - ₹150</p>
  <button class="cart-btn" onclick="addToCart('Maryam Attar',150)">Add to Cart</button>
</div>

</div>

<div class="cart">
  <h3>🛒 Cart</h3>
  <p>Items: <span id="count">0</span></p>
  <p>Total: ₹<span id="total">0</span></p>

  <h3>Customer Details</h3>
  <input type="text" id="name" placeholder="Your Name">
  <input type="text" id="address" placeholder="Your Address">

  <button class="order-btn" onclick="orderNow()">Order via WhatsApp</button>

  <br><br>

  <h3>UPI Payment</h3>
  <p>UPI ID: <b>919946800240@fedaral</b></p>
</div>

<script>
let count = 0;
let total = 0;
let items = "";

function addToCart(name, price){
  count++;
  total += price;
  items += name + ", ";

  document.getElementById("count").innerText = count;
  document.getElementById("total").innerText = total;
}

function orderNow(){
  let name = document.getElementById("name").value;
  let address = document.getElementById("address").value;

  let msg = "Order from Al Jannah Perfumes\n"
  + "Name: " + name + "\n"
  + "Address: " + address + "\n"
  + "Items: " + items + "\n"
  + "Total: ₹" + total;

  window.open("https://wa.me/919946800240?text=" + encodeURIComponent(msg));
}
</script>

</body>
</html>
