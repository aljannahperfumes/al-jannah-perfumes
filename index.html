<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Al Jannah Perfumes</title>

<style>

body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:#0f0f0f;
  color:white;
}

/* HEADER */

.header{
  text-align:center;
  padding:80px 20px;

  background:
  linear-gradient(rgba(0,0,0,0.7),rgba(0,0,0,0.7)),
  url('https://images.unsplash.com/photo-1541643600914-78b084683601?q=80&w=1400&auto=format&fit=crop');

  background-size:cover;
  background-position:center;
}

.logo{
  width:180px;
  filter:brightness(0) invert(1);
  margin-bottom:15px;
}

h1{
  color:gold;
  font-size:50px;
  margin-bottom:10px;
}

.tag{
  color:#ddd;
  font-size:22px;
}

/* PRODUCTS */

.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  gap:20px;
  padding:20px;
}

.product{
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(10px);
  border-radius:15px;
  padding:15px;
  text-align:center;
  transition:0.3s;
  border:1px solid rgba(255,215,0,0.2);

  box-shadow:0 0 10px rgba(255,215,0,0.1);
}

.product:hover{
  transform:translateY(-8px) scale(1.02);
  box-shadow:0 0 15px gold;
}

.product img{
  width:100%;
  height:260px;
  object-fit:cover;
  border-radius:10px;
  cursor:pointer;
}

/* BUTTON */

.btn{
  background:gold;
  border:none;
  padding:12px;
  width:100%;
  border-radius:8px;
  font-weight:bold;
  margin-top:10px;
  cursor:pointer;
  font-size:16px;
}

.btn:hover{
  box-shadow:0 0 10px gold;
}

/* CART */

.cart{
  background:#111;
  margin:20px;
  padding:25px;
  border-radius:15px;
  box-shadow:0 0 10px rgba(255,215,0,0.1);
}

.cart h3{
  color:gold;
  font-size:28px;
}

input{
  width:95%;
  padding:12px;
  margin:8px 0;
  border:none;
  border-radius:6px;
  font-size:16px;
}

.order{
  background:green;
  color:white;
  padding:12px;
  width:100%;
  border:none;
  border-radius:8px;
  font-size:18px;
  cursor:pointer;
}

.pay{
  background:#007bff;
  color:white;
  padding:12px;
  width:100%;
  border:none;
  border-radius:8px;
  font-size:18px;
  cursor:pointer;
}

/* IMAGE MODAL */

.modal{
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.9);
  justify-content:center;
  align-items:center;
  z-index:999;
}

.modal img{
  width:80%;
  max-width:450px;
  border-radius:12px;
}

/* MOBILE */

@media(max-width:768px){

.logo{
  width:140px;
}

h1{
  font-size:36px;
}

.tag{
  font-size:18px;
}

.product img{
  height:220px;
}

}

</style>
</head>

<body>

<!-- HEADER -->

<div class="header">

  <img src="logo.png" class="logo">

  <h1>Al Jannah Perfumes</h1>

  <p class="tag">
    Luxury Attar Collection ✨
  </p>

</div>

<!-- PRODUCTS -->

<div class="products">

<!-- PRODUCT 1 -->

<div class="product">

<img src="marj.jpg" onclick="zoom(this.src)">

<h3>Marj Attar</h3>

<p style="text-decoration:line-through;color:red;">
₹200
</p>

<p style="color:#00ffae;font-size:20px;">
Offer ₹150
</p>

<p style="color:gold;">
Save ₹50
</p>

<button class="btn" onclick="add('Marj Attar',150)">
Add to Cart
</button>

</div>

<!-- PRODUCT 2 -->

<div class="product">

<img src="musk.jpg" onclick="zoom(this.src)">

<h3>Musk Rijali</h3>

<p style="text-decoration:line-through;color:red;">
₹200
</p>

<p style="color:#00ffae;font-size:20px;">
Offer ₹150
</p>

<p style="color:gold;">
Save ₹50
</p>

<button class="btn" onclick="add('Musk Rijali',150)">
Add to Cart
</button>

</div>

<!-- PRODUCT 3 -->

<div class="product">

<img src="maryam.jpg" onclick="zoom(this.src)">

<h3>Maryam</h3>

<p style="text-decoration:line-through;color:red;">
₹200
</p>

<p style="color:#00ffae;font-size:20px;">
Offer ₹150
</p>

<p style="color:gold;">
Save ₹50
</p>

<button class="btn" onclick="add('Maryam',150)">
Add to Cart
</button>

</div>

</div>

<!-- CART -->

<div class="cart">

<h3>🛒 Order</h3>

<p id="items">No items</p>

<p style="font-size:22px;">
Total ₹<span id="total">0</span>
</p>

<input id="name" placeholder="Name">

<input id="address" placeholder="Address">

<button class="order" onclick="order()">
WhatsApp Order
</button>

<br><br>

<button class="pay" onclick="pay()">
UPI Pay
</button>

</div>

<!-- IMAGE ZOOM -->

<div class="modal" id="modal" onclick="closeModal()">

  <img id="modalImg">

</div>

<script>

let total = 0;
let list = [];

function add(name,price){

  total += price;

  list.push(name);

  document.getElementById("total").innerText = total;

  document.getElementById("items").innerText =
  list.join(", ");

}

function order(){

let msg =
"Order: " + list.join(", ") +
" Total ₹" + total;

window.open(
"https://wa.me/919946800240?text=" +
encodeURIComponent(msg)
);

}

function pay(){

window.location.href =
"upi://pay?pa=919946800240@federal&am=" + total;

}

/* IMAGE ZOOM */

function zoom(src){

  document.getElementById("modal").style.display =
  "flex";

  document.getElementById("modalImg").src = src;

}

function closeModal(){

  document.getElementById("modal").style.display =
  "none";

}

</script>

</body>
</html>
