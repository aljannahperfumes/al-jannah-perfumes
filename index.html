<!DOCTYPE html>
<html>
<head>

<title>Al Jannah Perfumes | Best Attar Shop</title>

<meta name="description" content="Buy premium attar perfumes like Marj, Musk Rijali, Maryam at best price. Order via WhatsApp.">

<meta name="google-site-verification" content="0hjziN4RgVmMMnO9IO4Kpgf-Sqru6mNv9PeYg4LcTvE" />

<style>
body { font-family: Arial; margin: 0; background: #f3f3f3; }

/* HEADER */
.main-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: linear-gradient(90deg, #131921, #232f3e);
  color: white;
  padding: 15px 20px;
}

.logo { font-size: 22px; font-weight: bold; }

#search {
  padding: 8px;
  width: 200px;
  border-radius: 5px;
  border: none;
}

.nav a {
  color: white;
  margin-left: 15px;
  text-decoration: none;
}

.nav a:hover { color: orange; }

/* PRODUCTS */
.products {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px,1fr));
  gap: 20px;
  padding: 20px;
}

.product {
  background: white;
  padding: 15px;
  border-radius: 10px;
  text-align: center;
  box-shadow: 0 0 10px rgba(0,0,0,0.1);
  transition: 0.3s;
}

.product:hover {
  transform: scale(1.05);
}

.product img {
  width: 100%;
  height: 150px;
  object-fit: cover;
}

/* BUTTONS */
.cart-btn {
  background: orange;
  border: none;
  padding: 10px;
  width: 100%;
  cursor: pointer;
}

.cart-btn:hover { background: darkorange; }

.order-btn {
  background: green;
  color: white;
  padding: 12px;
  width: 100%;
  border: none;
  margin-top: 10px;
  cursor: pointer;
}

.order-btn:hover { background: darkgreen; }

.pay-btn {
  background: blue;
  color: white;
  padding: 12px;
  width: 100%;
  border: none;
  margin-top: 10px;
  cursor: pointer;
}

/* CART */
.cart-box {
  background: white;
  margin: 20px;
  padding: 15px;
  border-radius: 10px;
}

input {
  width: 95%;
  padding: 10px;
  margin: 5px 0;
}
</style>

</head>

<body>

<header class="main-header">
  <div class="logo">🌿 Al Jannah Perfumes</div>

  <input type="text" id="search" placeholder="Search attar..." onkeyup="searchProduct()">

  <div class="nav">
    <a href="#">Home</a>
    <a href="#">Products</a>
    <a href="https://instagram.com/aljannahperfumes" target="_blank">Instagram</a>
  </div>
</header>

<h2 style="padding-left:20px;">Best Attar Shop in Kozhikode</h2>

<div class="products">

<div class="product">
<img src="https://images.unsplash.com/photo-1594035910387-fea47794261f">
<h3>Marj Attar</h3>
<p style="color:red;">🔥 Best Seller</p>
<p>3ML - ₹200</p>
<button class="cart-btn" onclick="addToCart('Marj Attar (3ML)',200)">Add to Cart</button>
</div>

<div class="product">
<img src="https://images.unsplash.com/photo-1615634260167-c8cdede054de">
<h3>Musk Rijali</h3>
<p>3ML - ₹200</p>
<button class="cart-btn" onclick="addToCart('Musk Rijali (3ML)',200)">Add to Cart</button>
</div>

<div class="product">
<img src="https://images.unsplash.com/photo-1600185365483-26d7a4cc7519">
<h3>Maryam Attar</h3>
<p>3ML - ₹150</p>
<button class="cart-btn" onclick="addToCart('Maryam Attar (3ML)',150)">Add to Cart</button>
</div>

</div>

<div class="cart-box">

<h2>🛒 Cart</h2>
<p id="items">Items: 0</p>
<p id="total">Total: ₹0</p>

<h3>Customer Details</h3>
<input type="text" id="name" placeholder="Your Name">
<input type="text" id="address" placeholder="Your Address">

<button class="order-btn" onclick="orderNow()">💬 Order via WhatsApp</button>
<button class="pay-btn" onclick="payNow()">💳 Pay via UPI</button>

</div>

<script>
let count = 0;
let total = 0;
let cartItems = "";

function addToCart(name, price) {
  count++;
  total += price;
  cartItems += name + ", ";

  document.getElementById("items").innerText = "Items: " + count;
  document.getElementById("total").innerText = "Total: ₹" + total;
}

function searchProduct() {
  let input = document.getElementById("search").value.toLowerCase();
  let products = document.getElementsByClassName("product");

  for (let i = 0; i < products.length; i++) {
    let text = products[i].innerText.toLowerCase();

    if (text.includes(input)) {
      products[i].style.display = "block";
    } else {
      products[i].style.display = "none";
    }
  }
}

function orderNow() {
  let customer = document.getElementById("name").value;
  let address = document.getElementById("address").value;

  if(customer == "" || address == "") {
    alert("Enter name and address");
    return;
  }

  let message =
  "🛒 Order - Al Jannah Perfumes\n\n" +
  "👤 Name: " + customer + "\n" +
  "📍 Address: " + address + "\n\n" +
  "🧴 Items: " + cartItems + "\n" +
  "💰 Total: ₹" + total;

  window.open("https://wa.me/918089900240?text=" + encodeURIComponent(message));
}

function payNow() {
  window.location.href = "upi://pay?pa=919946800240@federal&pn=Al%20Jannah%20Perfumes&cu=INR";
}
</script>

</body>
</html>
