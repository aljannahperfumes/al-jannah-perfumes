<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Al Jannah Perfumes</title>

<style>
body{
  margin:0;
  font-family: 'Segoe UI', sans-serif;

  /* 🔥 LUXURY BACKGROUND */
  background: linear-gradient(135deg, #000000, #1a1a1a, #3b2f2f);
  color:white;
}

/* HEADER */
.header{
  text-align:center;
  padding:60px 20px;
}

/* LOGO */
.logo{
  width:140px;
  display:block;
  margin:auto;
  margin-bottom:15px;
  filter: drop-shadow(0 0 15px gold);
}

h1{
  color:gold;
  font-size:28px;
  margin:5px;
}

.tag{
  color:#ddd;
}

/* INSTAGRAM */
.insta{
  display:inline-block;
  margin-top:10px;
  padding:8px 18px;
  background:linear-gradient(45deg,#E1306C,#ff7a00);
  color:white;
  border-radius:20px;
  text-decoration:none;
}

/* PRODUCTS */
.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
  padding:20px;
}

.product{
  background:rgba(255,255,255,0.05);
  backdrop-filter: blur(10px);
  padding:15px;
  border-radius:15px;
  text-align:center;
  border:1px solid rgba(255,215,0,0.2);
  transition:0.3s;
}

.product:hover{
  transform:translateY(-5px);
  box-shadow:0 0 15px gold;
}

.product img{
  width:100%;
  height:150px;
  object-fit:cover;
  border-radius:10px;
}

.btn{
  background:gold;
  border:none;
  padding:10px;
  width:100%;
  border-radius:5px;
  font-weight:bold;
}

/* CART */
.cart{
  background:rgba(255,255,255,0.05);
  margin:20px;
  padding:20px;
  border-radius:15px;
  border:1px solid rgba(255,215,0,0.2);
}

.pay{
  background:#007bff;
  color:white;
  padding:12px;
  width:100%;
  border:none;
  border-radius:5px;
}

.order{
  background:green;
  color:white;
  padding:12px;
  width:100%;
  border:none;
  border-radius:5px;
}

input{
  width:95%;
  padding:10px;
  margin:5px;
  border-radius:5px;
  border:none;
}

/* MOBILE */
@media(max-width:600px){
  .logo{
    width:110px;
  }
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">

<img src="./logo.png" class="logo"
onerror="this.style.display='none'">

<h1>Al Jannah Perfumes</h1>
<p class="tag">Luxury Attar Collection ✨</p>

<a href="https://instagram.com/aljannahperfumes" class="insta">
📲 Follow Instagram
</a>

</div>

<!-- PRODUCTS -->
<div class="products">

<div class="product">
<img src="https://images.unsplash.com/photo-1592945403244-b3fbafd7f539">
<h3>Marj Attar</h3>

<p style="text-decoration:line-through;color:red;">₹200</p>
<p style="color:#00ffae;font-weight:bold;">Offer ₹150</p>
<p style="color:gold;">Save ₹50</p>

<button class="btn" onclick="add('Marj Attar',150)">Add</button>
</div>

<div class="product">
<img src="https://images.unsplash.com/photo-1615634260167-c8cdede054de">
<h3>Musk Rijali</h3>

<p style="text-decoration:line-through;color:red;">₹200</p>
<p style="color:#00ffae;font-weight:bold;">Offer ₹150</p>
<p style="color:gold;">Save ₹50</p>

<button class="btn" onclick="add('Musk Rijali',150)">Add</button>
</div>

<div class="product">
<img src="https://images.unsplash.com/photo-1585386959984-a4155224a1ad">
<h3>Maryam</h3>
<p>₹150</p>
<button class="btn" onclick="add('Maryam',150)">Add</button>
</div>

</div>

<!-- CART -->
<div class="cart">

<h3>🛒 Order Summary</h3>

<p id="items">No items</p>
<p>Total ₹<span id="total">0</span></p>

<input id="name" placeholder="Your Name">
<input id="address" placeholder="Address">

<button class="order" onclick="order()">WhatsApp Order</button>

<br><br>

<button class="pay" onclick="pay()">UPI Pay</button>

<div style="text-align:center;margin-top:10px;">
<p>Scan & Pay</p>
<img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=upi://pay?pa=919946800240@federal">
</div>

</div>

<script>
let total=0;
let list=[];

function add(n,p){
  total+=p;
  list.push(n);
  document.getElementById("total").innerText=total;
  document.getElementById("items").innerText=list.join(", ");
}

function order(){
let msg="🧾 Order: "+list.join(", ")+" | Total ₹"+total;
window.open("https://wa.me/919946800240?text="+msg);
}

function pay(){
window.location.href="upi://pay?pa=919946800240@federal&am="+total;
}
</script>

</body>
</html>
