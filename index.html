<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Al Jannah Perfumes</title>

<style>
body{
  margin:0;
  font-family: Arial;
  background:#f8f8f8;  /* 🔥 clean light background */
}

/* HEADER */
.header{
  background:linear-gradient(to right,#000,#333);
  color:white;
  text-align:center;
  padding:40px 20px;
}

/* LOGO */
.logo{
  width:120px;
  display:block;
  margin:auto;
  margin-bottom:10px;
}

h1{
  color:gold;
  margin:5px;
}

.tag{
  color:#ccc;
}

/* PRODUCTS */
.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
  padding:20px;
}

.product{
  background:white;
  padding:15px;
  border-radius:10px;
  text-align:center;
  box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.product img{
  width:100%;
  height:150px;
  object-fit:cover;
}

.btn{
  background:gold;
  border:none;
  padding:10px;
  width:100%;
  border-radius:5px;
}

/* CART */
.cart{
  background:white;
  margin:20px;
  padding:15px;
  border-radius:10px;
}

.order{
  background:green;
  color:white;
  padding:10px;
  width:100%;
  border:none;
}

.pay{
  background:#007bff;
  color:white;
  padding:10px;
  width:100%;
  border:none;
}

input{
  width:95%;
  padding:10px;
  margin:5px;
}
</style>
</head>

<body>

<div class="header">
  <img src="./logo.png" class="logo">
  <h1>Al Jannah Perfumes</h1>
  <p class="tag">Premium Attar Collection</p>
</div>

<div class="products">

<div class="product">
<img src="https://images.unsplash.com/photo-1592945403244-b3fbafd7f539">
<h3>Marj Attar</h3>
<p style="text-decoration:line-through;color:red;">₹200</p>
<p style="color:green;">Offer ₹150</p>
<p style="color:orange;">Save ₹50</p>
<button class="btn" onclick="add('Marj',150)">Add</button>
</div>

<div class="product">
<img src="https://images.unsplash.com/photo-1615634260167-c8cdede054de">
<h3>Musk Rijali</h3>
<p style="text-decoration:line-through;color:red;">₹200</p>
<p style="color:green;">Offer ₹150</p>
<p style="color:orange;">Save ₹50</p>
<button class="btn" onclick="add('Musk',150)">Add</button>
</div>

</div>

<div class="cart">
<h3>Order</h3>
<p id="items">No items</p>
<p>Total ₹<span id="total">0</span></p>

<input id="name" placeholder="Name">
<input id="address" placeholder="Address">

<button class="order" onclick="order()">WhatsApp</button>
<br><br>
<button class="pay" onclick="pay()">UPI Pay</button>
</div>

<script>
let total=0;
let list=[];

function add(n,p){
total+=p;
list.push(n);
document.getElementById("total").innerText=total;
document.getElementById("items").innerText=list.join(",");
}

function order(){
let msg="Order: "+list.join(",")+" Total ₹"+total;
window.open("https://wa.me/919946800240?text="+msg);
}

function pay(){
window.location.href="upi://pay?pa=919946800240@federal&am="+total;
}
</script>

</body>
</html>
